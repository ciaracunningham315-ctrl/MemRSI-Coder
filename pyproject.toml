[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evocode"
version = "0.1.0"
description = "Evidence-backed coding agent with versioned memory and skill evolution"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3", "typer>=0.12,<1", "pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1"]

[project.scripts]
evocode = "evocode.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/evocode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "benchmark"]

[tool.ruff]
target-version = "py312"

